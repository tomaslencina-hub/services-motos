# Cada push a dev genera el instalador y lo publica como versión de prueba (pre-release).
# Las apps de producción no ven las pre-release; las instaladas desde dev se actualizan solas.
name: Versión de prueba (dev)

on:
  push:
    branches: [dev]

permissions:
  contents: write

concurrency:
  group: version-dev
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ej: package.json 1.0.0 -> 1.0.1-dev.7 (el 7 es el número de ejecución). No se commitea.
      - name: Marcar como versión de prueba
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = require('./package.json');
            const [a, b, c] = p.version.split('-')[0].split('.').map(Number);
            p.version = a + '.' + b + '.' + (c + 1) + '-dev.${{ github.run_number }}';
            p.build.publish[0].releaseType = 'draft';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
            fs.appendFileSync(process.env.GITHUB_ENV, 'VERSION=' + p.version + require('os').EOL);
            console.log('Versión de prueba:', p.version);
          "

      - run: npx ng build

      # El borrador se crea antes: electron-builder sube el instalador y el .blockmap en paralelo
      # y, si no existe, cada subida crea su propia versión y los archivos quedan repartidos.
      - name: Crear borrador de la versión
        run: gh release create "v$env:VERSION" --draft --title "$env:VERSION" --notes "Versión de prueba generada desde dev." --target "$env:GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Recién con todo subido se publica como pre-release: la app del taller no la toma.
      - name: Publicar como versión de prueba
        run: gh release edit "v$env:VERSION" --draft=false --prerelease --target "$env:GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
